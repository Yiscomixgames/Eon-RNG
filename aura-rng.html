const BADGE_CLASS={faded:"b-faded",common:"b-common",rare:"b-rare",epic:"b-epic",legendary:"b-legendary",mythic:"b-mythic",divine:"b-divine",cosmic:"b-cosmic",celestial:"b-celestial",transcendent:"b-transcendent",primordial:"b-primordial",abyssal:"b-abyssal",eternal:"b-eternal",voidborn:"b-voidborn",omega:"b-omega",secret:"b-secret",ultrasecret:"b-ultrasecret",null:"b-null",impossible:"b-impossible"};

const WORLD_BOOST=4; // active world auras are this many times more likely within their rarity bucket
function rollAura(luck,activeWorld){
  const adj={};let tot=0;
  RK.forEach(k=>{const w=RARITY[k].weight;if(w<=0)return;const p=k==="faded"?w:k==="common"?w:w*luck;adj[k]=p;tot+=p;});
  let r=Math.random()*tot;
  for(const k of RK){
    if(!adj[k])continue;
    r-=adj[k];
    if(r<=0){
      const pool=AURAS.filter(a=>a.rarity===k&&!a.theme&&(IS_BDAY||!a.bday)&&(!a.world||a.world===activeWorld));
      if(!pool.length)return AURAS.find(a=>a.rarity===k)||AURAS[0];
      let wtot=0;const weights=pool.map(a=>{const w=a.world&&a.world===activeWorld?WORLD_BOOST:1;wtot+=w;return w;});
      let rr=Math.random()*wtot;
      for(let i=0;i<pool.length;i++){rr-=weights[i];if(rr<=0)return pool[i];}
      return pool[pool.length-1];
    }
  }
  return AURAS[0];
}
function fmt(n){if(n>=1e12)return(n/1e12).toFixed(1)+"T";if(n>=1e9)return(n/1e9).toFixed(1)+"B";if(n>=1e6)return(n/1e6).toFixed(1)+"M";if(n>=1e3)return(n/1e3).toFixed(1)+"K";return n.toLocaleString();}

function HoloFrame({r}){
  if(!r||r.ord<5)return null;
  const intensity=Math.min(1,(r.ord-4)/14);
  return(<div style={{position:"absolute",inset:0,pointerEvents:"none",zIndex:2,borderRadius:"10px",overflow:"hidden"}}>
    <div style={{position:"absolute",inset:0,background:`conic-gradient(from 0deg,transparent,${r.color}55,transparent 35%)`,animation:`holoSpin ${3.5-intensity*1.5}s linear infinite`,opacity:.35+intensity*.4,mixBlendMode:"screen"}}/>
    <div style={{position:"absolute",inset:0,border:`${r.ord>=16?2:1}px solid ${r.color}70`,borderRadius:"10px",boxShadow:`inset 0 0 ${10+intensity*20}px ${r.color}30`}}/>
  </div>);
}

            const unlocked=unlockedWorlds.includes(w.id);
            const active=activeWorld===w.id;
            const auraCount=AURAS.filter(a=>a.world===w.id).length;const ownedCount=AURAS.filter(a=>a.world===w.id&&collection[a.id]).length;
            return(
              <div key={w.id} style={{background:`${w.color}${unlocked?"12":"06"}`,border:`1px solid ${active?w.color:w.color+(unlocked?"35":"15")}`,borderRadius:"10px",padding:"12px",boxShadow:active?`0 0 14px ${w.color}55`:"none"}}>
                <div style={{fontSize:"26px",marginBottom:"6px"}}>{w.icon}</div>
                <div style={{fontSize:"12px",fontWeight:700,color:unlocked?w.color:"#64748b",marginBottom:"3px"}}>{w.name}</div>
                <div style={{fontSize:"8.5px",color:"#475569",marginBottom:"8px"}}>{ownedCount}/{auraCount} auras · +{w.luckBonus} luck · +{w.speedBonus}ms spd</div>
                {!unlocked&&<button onClick={()=>onUnlock(w)} disabled={coins<w.cost} style={{width:"100%",padding:"6px 0",background:coins>=w.cost?`${w.color}22`:"rgba(255,255,255,.03)",border:`1px solid ${coins>=w.cost?w.color+"70":"rgba(255,255,255,.06)"}`,borderRadius:"6px",color:coins>=w.cost?w.color:"#334155",fontSize:"9.5px",cursor:coins<w.cost?"not-allowed":"pointer"}}>🔒 {fmt(w.cost)} 💰</button>}
                {unlocked&&<button onClick={()=>onActivate(active?null:w.id)} style={{width:"100%",padding:"6px 0",background:active?`${w.color}35`:`${w.color}15`,border:`1px solid ${w.color}${active?"90":"40"}`,borderRadius:"6px",color:w.color,fontSize:"9.5px",fontWeight:active?700:400,cursor:"pointer"}}>{active?"✓ ACTIVE":"SET ACTIVE"}</button>}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────
const SAVE_KEY="aura-rng-save-v1";
function loadSave(){try{const raw=localStorage.getItem(SAVE_KEY);return raw?JSON.parse(raw)||{}:{};}catch(e){return {};}}
const SAVE=loadSave();
function App(){
  const [coins,setCoins]           =useState(SAVE.coins??0);
  const [rolls,setRolls]           =useState(SAVE.rolls??0);
  const [luck,setLuck]             =useState(SAVE.luck??1.0);
  const [speedLvl,setSpeedLvl]     =useState(SAVE.speedLvl??1);
  const [equipped,setEquipped]     =useState(()=>AURAS.find(a=>a.id===SAVE.equipped)||null);
  const [lastRoll,setLastRoll]     =useState(null);
  const [history,setHistory]       =useState(()=>(SAVE.history||[]).map(id=>AURAS.find(a=>a.id===id)).filter(Boolean));
  const [collection,setCollection] =useState(SAVE.collection||{});
  const [auto,setAuto]             =useState(false);
  const [shopOpen,setShopOpen]     =useState(false);
  const [collOpen,setCollOpen]     =useState(false);
  const [codeInput,setCodeInput]   =useState("");
  const [usedCodes,setUsedCodes]   =useState(()=>new Set(SAVE.usedCodes||[]));
  const [notif,setNotif]           =useState(null);
  // Manual roll animation
  const [rolling,setRolling]       =useState(false);
  const [slotAura,setSlotAura]     =useState(null);
  // Auto roll animation (shorter spin)
  const [autoSpin,setAutoSpin]     =useState(false);
  const [autoSlot,setAutoSlot]     =useState(null);
  const [flash,setFlash]           =useState(null);
  // World system
  const [unlockedWorlds,setUnlockedWorlds]=useState(SAVE.unlockedWorlds||[]);
  const [activeWorld,setActiveWorld]      =useState(SAVE.activeWorld||null);
  const [worldsOpen,setWorldsOpen]        =useState(false);
  const [worldItemsBought,setWorldItemsBought]=useState(SAVE.worldItemsBought||[]);

  const themeKey=equipped?.theme??"default";
  const th=THEMES[themeKey];
  const worldLuckBonus=unlockedWorlds.reduce((s,id)=>s+(WORLDS.find(w=>w.id===id)?.luckBonus||0),0);
  const worldSpeedBonus=unlockedWorlds.reduce((s,id)=>s+(WORLDS.find(w=>w.id===id)?.speedBonus||0),0);
  const effectiveLuck=parseFloat((luck+worldLuckBonus).toFixed(2));
  const effectiveSpeedMs=Math.max(150,SPEED_MS[speedLvl-1]-worldSpeedBonus);
  const luckRef=useRef(effectiveLuck);
  const activeWorldRef=useRef(activeWorld);
  const fastRef=useRef(null);const slowRef=useRef(null);const slowTm=useRef(null);
  const autoSpinRef=useRef(null);const autoBusy=useRef(false);
  useEffect(()=>{luckRef.current=effectiveLuck;},[effectiveLuck]);
  useEffect(()=>{activeWorldRef.current=activeWorld;},[activeWorld]);
  useEffect(()=>{document.body.style.background=th.bodyBg;},[th]);
  useEffect(()=>{try{localStorage.setItem(SAVE_KEY,JSON.stringify({coins,rolls,luck,speedLvl,equipped:equipped?equipped.id:null,history:history.slice(0,60).map(x=>x.id),collection,usedCodes:[...usedCodes],unlockedWorlds,activeWorld,worldItemsBought}));}catch(e){}},[coins,rolls,luck,speedLvl,equipped,history,collection,usedCodes,unlockedWorlds,activeWorld,worldItemsBought]);

  // Manual roll slot machine (fast then slow, 1.3s total)
  const pool=AURAS.filter(a=>!a.theme&&(IS_BDAY||!a.bday));
  useEffect(()=>{
    if(!rolling){setSlotAura(null);return;}
    fastRef.current=setInterval(()=>setSlotAura(pool[Math.floor(Math.random()*pool.length)]),65);
    slowTm.current=setTimeout(()=>{clearInterval(fastRef.current);slowRef.current=setInterval(()=>setSlotAura(pool[Math.floor(Math.random()*pool.length)]),210);},900);
    return()=>{clearInterval(fastRef.current);clearInterval(slowRef.current);clearTimeout(slowTm.current);};
  },[rolling]);

  function showNotif(msg){setNotif(msg);setTimeout(()=>setNotif(null),2800);}

  function applyRoll(aura){
    const r=RARITY[aura.rarity];
    setCoins(c=>c+r.coins);setRolls(n=>n+1);setLastRoll(aura);
    setHistory(h=>[aura,...h].slice(0,120));
    setCollection(prev=>({...prev,[aura.id]:(prev[aura.id]||0)+1}));
    return r;
  }

  // Manual roll: full 1.3s spin animation
  function handleRoll(){
    if(rolling||autoSpin)return;
    setRolling(true);
    setTimeout(()=>{
      const aura=rollAura(luckRef.current,activeWorldRef.current);const r=applyRoll(aura);
      if(r.ord>=5){setFlash(r.color);setTimeout(()=>setFlash(null),r.ord>=10?1000:650);}
      setRolling(false);
      if(r.ord>=7)showNotif(`${aura.icon} ${aura.name} — ${r.label.toUpperCase()}! +${fmt(r.coins)} coins`);
    },1300);
  }

  // Auto roll: quick 5-frame spin (300ms), then result
  function triggerAutoRoll(){
    if(autoBusy.current)return;
    autoBusy.current=true;
    const result=rollAura(luckRef.current,activeWorldRef.current);
    let ticks=0;
    setAutoSpin(true);
    autoSpinRef.current=setInterval(()=>{
      setAutoSlot(pool[Math.floor(Math.random()*pool.length)]);
      ticks++;
      if(ticks>=5){
        clearInterval(autoSpinRef.current);
        setAutoSpin(false);setAutoSlot(null);
        autoBusy.current=false;
        const r=applyRoll(result);
        if(r.ord>=10){setFlash(r.color);setTimeout(()=>setFlash(null),500);showNotif(`${result.icon} ${result.name} — ${r.label.toUpperCase()}!`);}
      }
    },60);
  }

  useEffect(()=>{
    if(!auto){clearInterval(autoSpinRef.current);setAutoSpin(false);setAutoSlot(null);autoBusy.current=false;return;}
    const id=setInterval(triggerAutoRoll,effectiveSpeedMs);
    return()=>{clearInterval(id);clearInterval(autoSpinRef.current);autoBusy.current=false;};
  },[auto,speedLvl,worldSpeedBonus]); // eslint-disable-line

  function buyLuck(item){if(coins<item.cost){showNotif("Not enough coins!");return;}setCoins(c=>c-item.cost);setLuck(l=>parseFloat((l+item.boost).toFixed(2)));showNotif(`${item.label} applied! ✨`);}
  function buySpeed(item){if(speedLvl>=item.level)return;if(coins<item.cost){showNotif("Not enough coins!");return;}setCoins(c=>c-item.cost);setSpeedLvl(item.level);showNotif(`Speed upgraded to Lv.${item.level}!`);}
  function redeem(){
    const code=codeInput.trim().toUpperCase();if(!code)return;
    if(usedCodes.has(code)){showNotif("Code already used!");return;}
    const reward=ALL_CODES[code];if(!reward){showNotif("❌ Invalid code!");return;}
    if(reward.coins)setCoins(c=>c+reward.coins);
    if(reward.luck)setLuck(l=>parseFloat((l+reward.luck).toFixed(2)));
    if(reward.aura){const aura=AURAS.find(a=>a.id===reward.aura);if(aura){setCollection(prev=>({...prev,[aura.id]:(prev[aura.id]||0)+1}));showNotif(reward.msg);}}
    else showNotif(reward.msg);
    setUsedCodes(prev=>new Set([...prev,code]));setCodeInput("");
  }
  function unlockWorld(w){
    if(unlockedWorlds.includes(w.id))return;
    if(coins<w.cost){showNotif("Not enough coins!");return;}
    setCoins(c=>c-w.cost);
    setUnlockedWorlds(prev=>[...prev,w.id]);
    showNotif(`${w.icon} ${w.name} unlocked! +${w.luckBonus} luck, +${w.speedBonus}ms speed`);
  }
  function activateWorld(id){
    setActiveWorld(id);
    if(id){const w=WORLDS.find(x=>x.id===id);showNotif(`${w.icon} ${w.name} is now active!`);}
    else showNotif("World deactivated");
  }
  function buyWorldItem(w){
    if(worldItemsBought.includes(w.id))return;
    if(coins<w.shopItem.cost){showNotif("Not enough coins!");return;}
    setCoins(c=>c-w.shopItem.cost);
    setLuck(l=>parseFloat((l+w.shopItem.boost).toFixed(2)));
    setWorldItemsBought(prev=>[...prev,w.id]);
    showNotif(`${w.shopItem.name} purchased! +${w.shopItem.boost} luck`);
  }

  function resetProgress(){
    let ok=true;try{ok=window.confirm("Reset ALL progress? This can't be undone.");}catch(e){}
    if(!ok)return;
    try{localStorage.removeItem(SAVE_KEY);}catch(e){}
    window.location.reload();
  }

  const card={background:th.cardBg,border:`1px solid ${th.cardBorder}`,borderRadius:"10px",padding:"14px",backdropFilter:"blur(8px)"};
  const isRolling=rolling||autoSpin;
  const currentSlot=slotAura||autoSlot;
  const currentSlotR=currentSlot?RARITY[currentSlot.rarity]:null;
  const isTechy=themeKey==="techy";

  return(
    <div style={{minHeight:"100vh",fontFamily:th.font,position:"relative",zIndex:1,paddingTop:IS_BDAY?"36px":"0px",paddingBottom:IS_BDAY?"36px":"0px"}}>
      {/* 🎂 Birthday banners + background */}
      {IS_BDAY&&<><TopBanner/><BottomBanner/><BirthdayBg/></>}
      {themeKey==="default"&&<SpaceBg/>}
      {themeKey==="tokyo"    &&<TokyoBg/>}
      {themeKey==="infernal" &&<InfernalBg/>}
      {themeKey==="techy"    &&<TechyBg/>}
      {flash&&<div style={{position:"fixed",inset:0,zIndex:999,background:flash,pointerEvents:"none",animation:"flashFade .9s ease-out forwards"}}/>}
      {notif&&<div style={{position:"fixed",top:"18px",left:"50%",zIndex:998,background:"rgba(10,10,28,.97)",border:"1px solid rgba(255,255,255,.12)",borderRadius:"20px",padding:"8px 20px",fontSize:"12px",color:"#e2e8f0",whiteSpace:"nowrap",animation:"notifAnim 2.8s ease forwards",backdropFilter:"blur(10px)",pointerEvents:"none"}}>{notif}</div>}
      {collOpen&&<CollectionModal collection={collection} onClose={()=>setCollOpen(false)} onEquip={a=>{setEquipped(a);showNotif(`${a.icon} ${a.name} equipped!`);}} equipped={equipped} th={th}/>}
      {worldsOpen&&<WorldsModal unlockedWorlds={unlockedWorlds} activeWorld={activeWorld} coins={coins} collection={collection} onUnlock={unlockWorld} onActivate={activateWorld} onClose={()=>setWorldsOpen(false)} th={th}/>}

      {/* Title */}
      <div style={{textAlign:"center",paddingTop:"28px",paddingBottom:"14px",position:"relative",zIndex:1}}>
        <h1 style={{fontFamily:"'Cinzel',serif",fontSize:"clamp(28px,7vw,50px)",fontWeight:900,letterSpacing:"8px",background:th.titleGrad,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",backgroundClip:"text",animation:th.titleAnim}}>{th.title}</h1>
        <p style={{color:th.muted,fontSize:"10px",letterSpacing:isTechy?"2px":"5px",marginTop:"5px"}}>{th.sub??`${AURAS.length} AURAS · ${RK.length} RARITIES`}</p>
        {th.sub&&<p style={{color:th.muted,fontSize:"9px",letterSpacing:"2px",marginTop:"3px",opacity:.6}}>{AURAS.length} AURAS · {RK.length} RARITIES</p>}
      </div>

      {/* Stats */}
      <div style={{display:"flex",justifyContent:"center",gap:"7px",flexWrap:"wrap",padding:"0 14px 16px",position:"relative",zIndex:1}}>
        {[{label:"Coins",val:`${fmt(coins)} 💰`},{label:"Rolls",val:rolls.toLocaleString()},{label:"Luck",val:`×${effectiveLuck.toFixed(2)}`},{label:"Speed",val:`Lv.${speedLvl}`}].map(s=>(
          <div key={s.label} style={{background:th.statBg,border:`1px solid ${th.statBorder}`,borderRadius:"8px",padding:"6px 14px",display:"flex",gap:"8px",alignItems:"baseline"}}>
            <span style={{color:th.muted,fontSize:"9.5px",letterSpacing:"1px"}}>{s.label}</span>
            <span style={{color:th.accent,fontSize:"13px",fontWeight:500}}>{s.val}</span>
          </div>
        ))}
      </div>

      {activeWorld&&(()=>{const w=WORLDS.find(x=>x.id===activeWorld);return(
        <div style={{textAlign:"center",marginBottom:"10px",position:"relative",zIndex:1}}>
          <span style={{display:"inline-flex",alignItems:"center",gap:"6px",background:`${w.color}18`,border:`1px solid ${w.color}50`,borderRadius:"20px",padding:"4px 14px",fontSize:"10px",color:w.color,letterSpacing:"1px"}}>{w.icon} {w.name} ACTIVE</span>
        </div>
      );})()}

      {/* Content */}
      <div style={{maxWidth:"680px",margin:"0 auto",padding:"0 14px 40px",display:"flex",flexDirection:"column",gap:"9px",position:"relative",zIndex:1}}>

        {/* Equipped */}
        <div style={card}>
          <div style={{display:"flex",alignItems:"center",gap:"6px",marginBottom:"10px"}}>
            <span style={{color:th.accent}}>⚡</span>
            <span style={{fontFamily:th.font,fontSize:"9px",letterSpacing:"3px",color:th.muted}}>EQUIPPED AURA</span>
          </div>
          <AuraDisplay aura={equipped} onUnequip={()=>setEquipped(null)}/>
        </div>

        {/* Last roll reveal */}
        {lastRoll&&!rolling&&(()=>{const lr=RARITY[lastRoll.rarity];return(
          <div key={auto?"lr":`lr-${rolls}`} style={{...card,padding:0,overflow:"hidden",border:`1px solid ${lr.color}55`,animation:"popIn .35s ease-out"}}>
            <div style={{position:"relative",height:"124px"}}>
              <AuraCardEffect id={lastRoll.id}/>
              <HoloFrame r={lr}/>
              <div style={{position:"absolute",left:0,right:0,bottom:0,padding:"8px 12px",background:"linear-gradient(transparent,rgba(5,5,20,.92))",zIndex:3,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                  <span style={{fontSize:"22px"}}>{lastRoll.icon}</span>
                  <div><div style={{fontSize:"12px",fontWeight:700,color:lr.color,fontFamily:th.font}}>{lastRoll.name}</div><div style={{fontSize:"8px",letterSpacing:"2px",color:lr.color,opacity:.75}}>LAST ROLL · {lr.label.toUpperCase()}</div></div>
                </div>
                {lastRoll.id!==equipped?.id
                  ?<button onClick={()=>setEquipped(lastRoll)} style={{background:`${lr.color}22`,border:`1px solid ${lr.color}70`,borderRadius:"6px",padding:"5px 11px",color:lr.color,fontSize:"10px",letterSpacing:"1px",fontFamily:th.font}}>⚡ EQUIP</button>
                  :<span style={{fontSize:"9px",color:lr.color,letterSpacing:"1px"}}>✓ EQUIPPED</span>}
              </div>
            </div>
          </div>
        );})()}

        {/* Slot machine (manual + auto share same display) — shows the real card effect live */}
        {isRolling&&currentSlot&&(
          <div style={{position:"relative",borderRadius:"10px",overflow:"hidden",height:autoSpin?"100px":"170px",border:`1px solid ${currentSlotR?.color??"#818cf8"}55`,animation:"slotFlick .1s ease-in-out infinite"}}>
            <AuraCardEffect id={currentSlot.id}/>
            <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(0,0,0,.55) 100%)"}}>
              <div style={{fontSize:autoSpin?"30px":"46px",marginBottom:"4px",lineHeight:1,filter:"drop-shadow(0 2px 6px rgba(0,0,0,.8))",animation:"spinIcon .22s linear infinite"}}>{currentSlot.icon}</div>
              <div style={{fontFamily:th.font,fontSize:autoSpin?"12px":"16px",color:"#fff",letterSpacing:"2px",textShadow:"0 2px 6px rgba(0,0,0,.9)",fontWeight:700}}>{currentSlot.name}</div>
              {!autoSpin&&<div style={{fontSize:"9px",color:currentSlotR?.color,letterSpacing:"2px",marginTop:"3px",textShadow:"0 1px 4px rgba(0,0,0,.9)",fontWeight:700}}>{currentSlotR?.label.toUpperCase()}</div>}
            </div>
          </div>
        )}

        {/* Roll button */}
        <button onClick={handleRoll} disabled={isRolling} style={{padding:"17px",background:isRolling?"rgba(100,100,100,.2)":th.rollBtn,border:"none",borderRadius:"10px",color:isRolling?"rgba(255,255,255,.4)":"#fff",fontFamily:th.font,fontSize:"17px",fontWeight:700,letterSpacing:"5px",cursor:isRolling?"not-allowed":"pointer",animation:isRolling?"none":th.rollAnim,display:"flex",alignItems:"center",justifyContent:"center",gap:"10px"}}>
          {isRolling?<><span style={{display:"inline-block",animation:"spinIcon .7s linear infinite"}}>⟳</span>{autoSpin?"AUTO...":"ROLLING..."}</>:isTechy?"> ROLL":themeKey==="default"?"🚀 ROLL":"⚡ ROLL"}
        </button>

        {/* Auto + Shop + Worlds */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}}>
          <button onClick={()=>setAuto(a=>!a)} style={{padding:"11px",background:auto?`${th.accent}20`:"rgba(255,255,255,.03)",border:`1px solid ${auto?th.accent+"80":"rgba(255,255,255,.07)"}`,borderRadius:"8px",color:auto?th.accent:"#475569",fontFamily:th.font,fontSize:"10px",letterSpacing:"2px",cursor:"pointer"}}>🤖 AUTO: {auto?"ON":"OFF"}</button>
          <button onClick={()=>setShopOpen(s=>!s)} style={{padding:"11px",background:shopOpen?`${th.accent}18`:"rgba(255,255,255,.03)",border:`1px solid ${shopOpen?th.accent+"60":"rgba(255,255,255,.07)"}`,borderRadius:"8px",color:shopOpen?th.accent:"#475569",fontFamily:th.font,fontSize:"10px",letterSpacing:"2px",cursor:"pointer"}}>🛒 {isTechy?"UPGRADES":"LUCK SHOP"}</button>
        </div>
        <button onClick={()=>setWorldsOpen(true)} style={{padding:"11px",background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.07)",borderRadius:"8px",color:"#475569",fontFamily:th.font,fontSize:"10px",letterSpacing:"2px",cursor:"pointer"}}>🗺️ WORLDS ({unlockedWorlds.length}/{WORLDS.length})</button>

        {auto&&<div style={{textAlign:"center",fontSize:"10px",color:th.muted,letterSpacing:"1px"}}>Rolling every ~{effectiveSpeedMs}ms · {fmt(coins)} coins earned</div>}

        {/* Shop */}
        {shopOpen&&(
          <div style={{...card,animation:"slideDown .2s ease-out"}}>
            <div style={{fontFamily:th.font,fontSize:"9px",letterSpacing:"3px",color:th.muted,marginBottom:"12px"}}>⭐ LUCK UPGRADES</div>
            <div style={{display:"flex",flexDirection:"column",gap:"6px",marginBottom:"16px"}}>
              {LUCK_SHOP.map(item=>(
                <div key={item.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"rgba(255,255,255,.02)",border:"1px solid rgba(255,255,255,.05)",borderRadius:"7px",padding:"8px 11px"}}>
                  <div><div style={{fontSize:"12px",color:"#cbd5e1"}}>{item.name}</div><div style={{fontSize:"9px",color:"#4ade80",marginTop:"1px"}}>{item.label}</div></div>
                  <button onClick={()=>buyLuck(item)} disabled={coins<item.cost} style={{background:coins>=item.cost?`${th.accent}20`:"rgba(255,255,255,.03)",border:`1px solid ${coins>=item.cost?th.accent+"60":"rgba(255,255,255,.06)"}`,borderRadius:"6px",padding:"5px 11px",color:coins>=item.cost?th.accent:"#334155",fontSize:"10px",cursor:coins<item.cost?"not-allowed":"pointer",whiteSpace:"nowrap"}}>💰 {fmt(item.cost)}</button>
                </div>
              ))}
            </div>
            <div style={{fontFamily:th.font,fontSize:"9px",letterSpacing:"3px",color:th.muted,marginBottom:"12px"}}>⚡ SPEED UPGRADES</div>
            <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
              {SPEED_SHOP.map(item=>{const owned=speedLvl>=item.level;return(
                <div key={item.level} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"rgba(255,255,255,.02)",border:"1px solid rgba(255,255,255,.05)",borderRadius:"7px",padding:"8px 11px",opacity:owned?.5:1}}>
                  <div><div style={{fontSize:"12px",color:"#cbd5e1"}}>{item.name}</div><div style={{fontSize:"9px",color:"#60a5fa",marginTop:"1px"}}>Interval: {item.label}</div></div>
                  <button onClick={()=>buySpeed(item)} disabled={owned||coins<item.cost} style={{background:owned?"rgba(34,197,94,.1)":coins>=item.cost?"rgba(96,165,250,.14)":"rgba(255,255,255,.03)",border:`1px solid ${owned?"rgba(34,197,94,.3)":coins>=item.cost?"rgba(96,165,250,.4)":"rgba(255,255,255,.06)"}`,borderRadius:"6px",padding:"5px 11px",color:owned?"#4ade80":coins>=item.cost?"#60a5fa":"#334155",fontSize:"10px",cursor:(owned||coins<item.cost)?"not-allowed":"pointer",whiteSpace:"nowrap"}}>{owned?"✓ Owned":`💰 ${fmt(item.cost)}`}</button>
                </div>
              );})}
            </div>
            {unlockedWorlds.length>0&&(<>
              <div style={{fontFamily:th.font,fontSize:"9px",letterSpacing:"3px",color:th.muted,marginTop:"16px",marginBottom:"12px"}}>🗺️ WORLD ITEMS</div>
              <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
                {unlockedWorlds.map(wid=>{const w=WORLDS.find(x=>x.id===wid);const owned=worldItemsBought.includes(wid);return(
                  <div key={wid} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:`${w.color}08`,border:`1px solid ${w.color}20`,borderRadius:"7px",padding:"8px 11px",opacity:owned?.5:1}}>
                    <div><div style={{fontSize:"12px",color:"#cbd5e1"}}>{w.icon} {w.shopItem.name}</div><div style={{fontSize:"9px",color:w.color,marginTop:"1px"}}>+{w.shopItem.boost} Luck</div></div>
                    <button onClick={()=>buyWorldItem(w)} disabled={owned||coins<w.shopItem.cost} style={{background:owned?"rgba(34,197,94,.1)":coins>=w.shopItem.cost?`${w.color}20`:"rgba(255,255,255,.03)",border:`1px solid ${owned?"rgba(34,197,94,.3)":coins>=w.shopItem.cost?w.color+"60":"rgba(255,255,255,.06)"}`,borderRadius:"6px",padding:"5px 11px",color:owned?"#4ade80":coins>=w.shopItem.cost?w.color:"#334155",fontSize:"10px",cursor:(owned||coins<w.shopItem.cost)?"not-allowed":"pointer",whiteSpace:"nowrap"}}>{owned?"✓ Owned":`💰 ${fmt(w.shopItem.cost)}`}</button>
                  </div>
                );})}
              </div>
            </>)}
          </div>
        )}

        {/* Redeem */}
        <div style={card}>
          <div style={{display:"flex",alignItems:"center",gap:"6px",marginBottom:"10px"}}><span>🔑</span><span style={{fontFamily:th.font,fontSize:"9px",letterSpacing:"3px",color:th.muted}}>REDEEM CODE</span></div>
          <div style={{display:"flex",gap:"7px"}}>
            <input value={codeInput} onChange={e=>setCodeInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&redeem()} placeholder={isTechy?"enter_code...":"Enter code..."} style={{flex:1,background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.08)",borderRadius:"7px",padding:"9px 12px",color:"#e2e8f0",fontSize:"12px",fontFamily:th.font}}/>
            <button onClick={redeem} style={{padding:"9px 16px",background:`${th.accent}20`,border:`1px solid ${th.accent}60`,borderRadius:"7px",color:th.accent,fontFamily:th.font,fontSize:"10px",letterSpacing:"1px"}}>REDEEM</button>
          </div>
          <div style={{fontSize:"9px",color:th.muted,marginTop:"6px"}}>Try: AURA2024 · LUCKYSTAR · FREEGEMS · PRIMORDIAL · UPDATE1</div>
          {IS_BDAY&&<div style={{fontSize:"9px",color:"#ec4899",marginTop:"3px",letterSpacing:"1px"}}>🎂 Birthday: HAPPYBDAY · JUNE7TH</div>}
        </div>

        {/* History */}
        <div style={card}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"11px"}}>
            <div style={{display:"flex",alignItems:"center",gap:"8px"}}><span style={{fontFamily:th.font,fontSize:"9px",letterSpacing:"3px",color:th.muted}}>ROLL HISTORY</span><span style={{color:th.muted,fontSize:"10px"}}>{rolls.toLocaleString()} rolls</span></div>
            <button onClick={()=>setCollOpen(true)} style={{display:"flex",alignItems:"center",gap:"5px",background:`${th.accent}14`,border:`1px solid ${th.accent}40`,borderRadius:"7px",padding:"5px 12px",color:th.accent,fontFamily:th.font,fontSize:"9px",letterSpacing:"1px",cursor:"pointer"}}>🏆 COLLECTION</button>
          </div>
          <div style={{display:"flex",flexWrap:"wrap",gap:"5px",maxHeight:"220px",overflowY:"auto"}}>
            {history.length===0?<div style={{color:th.muted,fontSize:"11px",letterSpacing:"2px",width:"100%",textAlign:"center",padding:"24px",fontFamily:th.font}}>{isTechy?"> awaiting input_":"Hit ROLL to begin"}</div>:history.map((a,i)=><Badge key={i} aura={a}/>)}
          </div>
        </div>

        {/* Rarity reference */}
        <div style={card}>
          <div style={{fontFamily:th.font,fontSize:"9px",letterSpacing:"3px",color:th.muted,marginBottom:"10px"}}>RARITY REFERENCE</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"5px"}}>
            {RK.map(k=>{const rc=RARITY[k];const w=rc.weight;const pct=w===0?"Code Only":w<.0001?`${(w/TOTAL_W*100).toFixed(6)}%`:w<.01?`${(w/TOTAL_W*100).toFixed(4)}%`:w<.1?`${(w/TOTAL_W*100).toFixed(3)}%`:`${(w/TOTAL_W*100).toFixed(1)}%`;return(<div key={k} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"4px 8px",background:`${rc.color}10`,border:`1px solid ${rc.color}22`,borderRadius:"5px"}}><span style={{color:rc.color,fontSize:"9px",fontFamily:th.font}}>{rc.label}</span><span style={{color:th.muted,fontSize:"7.5px"}}>{pct}</span></div>);})}
          </div>
        </div>

        <div style={{textAlign:"center",padding:"6px 0 2px",fontSize:"9px",color:th.muted,letterSpacing:"1px"}}>
          💾 Progress saves automatically on this device ·{" "}
          <button onClick={resetProgress} style={{background:"none",border:"none",color:"#ef4444aa",fontSize:"9px",textDecoration:"underline",padding:0,letterSpacing:"1px"}}>reset</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
